services:
  bead-8.1:
    container_name: "bead-8.1"
    build:
      dockerfile: "./Dockerfile"
      args:
        PHP_VERSION: "8.1"
    tty: true
    stdin_open: true
    volumes:
      - "./:/bead-framework"
    working_dir: "/bead-framework"
    user: "bead"
    environment:
      PHP_IDE_CONFIG: "serverName=BeadFramework"
      XDEBUG_CONFIG: "client_host=xdebug-client"
    extra_hosts:
      - "xdebug-client:host-gateway"

